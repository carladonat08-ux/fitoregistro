name: Descargar fuentes de protocolos

# Descarga los documentos públicos de los protocolos (listas de fitosanitarios) para
# revisarlos y transcribirlos. Deja el texto extraído en la rama temporal «fuentes-tmp»
# (no se publica en la web); se borra después de usarla.
on:
  workflow_dispatch:
    inputs:
      borrar:
        description: "Solo borrar la rama temporal fuentes-tmp"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  borrar:
    if: ${{ inputs.borrar }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git push origin --delete fuentes-tmp || true
  fuentes:
    if: ${{ !inputs.borrar }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: |
          mkdir -p fuentes && cd fuentes
          get() { curl -sSL --retry 3 --max-time 120 -A "Mozilla/5.0 (FitoLupa)" -o "$1" "$2" && echo "OK $1 $(stat -c%s "$1")" || echo "FALLO $1"; }
          get tesco_wb.pdf "https://web.archive.org/web/2026id_/https://www.tescoplc.com/media/759510/tesco-highly-hazardous-pesticide-list.pdf"
          get tesco_wb2.pdf "https://web.archive.org/web/2025id_/https://www.tescoplc.com/media/759510/tesco-highly-hazardous-pesticide-list.pdf"
          python3 ../scripts/ue_sustancias.py ue_sustancias.json || echo "UE falló" > ue_fallo.txt
          ls -la
      - name: Extraer texto y subir a la rama temporal
        run: |
          which pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          cd fuentes
          ls -la > _listado.txt
          for f in *.pdf; do pdftotext -layout "$f" "${f%.pdf}.txt" || echo "pdftotext falló $f" >> _listado.txt; rm -f "$f"; done
          cd ..
          git config user.name "FitoLupa bot"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan fuentes-tmp
          git rm -rq --cached . || true
          git add -f fuentes
          git commit -qm "Fuentes de protocolos (temporal)"
          git push -f origin fuentes-tmp
